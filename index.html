<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Inna ❤️</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Floating Hearts -->
  <div class="hearts"></div>

  <!-- Page 1 -->
  <div class="card" id="page1">
    <h1>Inna ❤️</h1>
    <h2>Will you be my Valentine?</h2>

    <div class="buttons">
      <button class="yes" onclick="showLove()">YES ✅</button>
      <button class="no" id="noBtn">NO 🙄</button>
    </div>

    <p class="small">Choose wisely 😌</p>
  </div>

  <!-- Page 2 -->
  <div class="card hidden" id="page2">
    <h1>YAYYYYY 💘</h1>
    <h2>You’re my Valentine forever, Inna ❤️</h2>

    <img src="ourpic.jpg" alt="Us" class="photo" />

    <p class="msg">Now come here 😘</p>
    <p class="small">Screenshot this & send it to me ❤️</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
